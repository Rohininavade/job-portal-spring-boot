<div class="card">
  <h2>Create Job</h2>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div><label>Title</label><input formControlName="title" /></div>
    <div><label>Description</label><textarea formControlName="description"></textarea></div>
    <div><label>Type</label><input formControlName="type" /></div>
    <div><label>Location</label><input formControlName="location" /></div>
    <div><label>Stipend/Salary</label><input formControlName="stipendSalary" /></div>
    <div><label>Skills (comma separated)</label><input formControlName="skills" /></div>
    <div *ngIf="error" class="error">{{ error }}</div>
    <button type="submit">Create</button>
  </form>
</div>
