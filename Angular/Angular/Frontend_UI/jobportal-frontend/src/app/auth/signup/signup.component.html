<div class="card">
  <h2>Sign Up</h2>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div><label>Username</label><input formControlName="username" /></div>
    <div><label>Email</label><input formControlName="email" /></div>
    <div><label>Password</label><input type="password" formControlName="password" /></div>
    <div>
      <label>Role</label>
      <select formControlName="role">
        <option value="JOB_SEEKER">Job Seeker</option>
        <option value="COMPANY">Company</option>
      </select>
    </div>
    <div><label>Name</label><input formControlName="name" /></div>
    <div *ngIf="error" class="error">{{ error }}</div>
    <button type="submit">Sign Up</button>
  </form>
</div>
